icms_mcp.catalog_descriptions:
  type: config_object
  label: 'ICMS MCP catalog description overrides'
  mapping:
    descriptions:
      type: ignore
      label: 'Description overrides keyed by entity type and bundle'

icms_mcp.catalog_options:
  type: config_object
  label: 'ICMS MCP Blökkli option overrides'
  mapping:
    options:
      type: ignore
      label: 'Option definition overrides keyed by option name'
    sourceBackgrounds:
      type: sequence
      label: 'Source background pictures that are decoration'
      sequence:
        type: mapping
        mapping:
          file:
            type: string
            label: 'File name of the background picture'
          option:
            type: string
            label: 'Option the target draws the decoration with (empty = leave the picture out)'
          value:
            type: ignore
            label: 'Value of that option'
    enforced:
      type: sequence
      label: 'Option and field values every migrated component gets'
      sequence:
        type: mapping
        mapping:
          bundle:
            type: string
            label: 'Paragraph bundle, or * for every bundle that has the option or field'
          option:
            type: string
            label: 'Blökkli option (set this or field)'
          field:
            type: string
            label: 'Paragraph field (set this or option)'
          value:
            type: ignore
            label: 'The value the import always writes'
          node_type:
            type: string
            label: 'Only on pages of this content type (empty = every type)'
          when:
            type: string
            label: 'Only when the source section has a picture (picture) or none (no-picture); empty = always'

icms_mcp.catalog_examples:
  type: config_object
  label: 'ICMS MCP layout example showcase'
  mapping:
    root:
      type: string
      label: 'Showcase root page: path alias, node id or node uuid'
    menu:
      type: string
      label: 'Menu the showcase pages are linked in (empty = any)'
    max_depth:
      type: integer
      label: 'How many menu levels below the root are indexed'
    langcode:
      type: string
      label: 'Language the examples are read in (empty = the root page language)'
